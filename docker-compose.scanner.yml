services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      PORT: 4000
      WORKER_INTERNAL_URL: http://scanner-worker:4100
    depends_on:
      scanner-worker:
        condition: service_started
    networks: [api-egress, scanner-private]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    restart: unless-stopped

  scanner-worker:
    build:
      context: .
      dockerfile: scanner-worker/Dockerfile
    environment:
      PORT: 4100
      WORKER_API_SECRET: ${WORKER_API_SECRET:?Set WORKER_API_SECRET in the deployment environment}
      MAX_ARCHIVE_SIZE: ${MAX_ARCHIVE_SIZE:-26214400}
      MAX_EXTRACTED_SIZE: ${MAX_EXTRACTED_SIZE:-262144000}
      MAX_ARCHIVE_FILES: ${MAX_ARCHIVE_FILES:-5000}
      MAX_COMPRESSION_RATIO: ${MAX_COMPRESSION_RATIO:-100}
      TRIVY_CACHE_DIR: /var/lib/trivy
    networks: [scanner-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/secureship/tmp:size=512m,uid=1000,gid=1000,mode=0700
    volumes:
      - trivy-cache:/var/lib/trivy:ro
    restart: unless-stopped

networks:
  api-egress: {}
  scanner-private:
    internal: true
    name: secureship-scanner-private

volumes:
  trivy-cache:
    name: secureship-trivy-cache
